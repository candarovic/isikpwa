<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#0a1526">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>IŞIK Spor Kulübü · Yönetim Paneli</title>
<link rel="manifest" href="manifest.json">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<meta name="application-name" content="IŞIK Spor Kulübü">
<meta name="apple-mobile-web-app-title" content="IŞIK Spor Kulübü">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app">
<aside class="sidebar">
  <div class="brand"><div class="brandIcon">🏆</div><div><b>IŞIK SPOR KULÜBÜ</b><small>Yönetim Merkezi</small></div></div>
  <nav class="nav">
    <div class="section">Genel</div>
    <button class="active" data-page="dashboard" onclick="go('dashboard')"><i>📊</i><span>Genel Bakış</span></button>
    <button data-page="students" onclick="go('students')"><i>👥</i><span>Öğrenciler</span></button>
    <button data-page="reports" onclick="go('reports')"><i>🏅</i><span>Gelişim Raporları</span></button>
    <div class="section">Finans</div>
    <button data-page="payments" onclick="go('payments')"><i>💳</i><span>Ödemeler</span></button>
    <button data-page="annual" onclick="go('annual')"><i>📅</i><span>Yıllık Ödemeler</span></button>
    <button data-page="finance" onclick="go('finance')"><i>📈</i><span>Gelir / Gider</span></button>
    <div class="section">Katılım</div>
    <button data-page="attendance" onclick="go('attendance')"><i>📋</i><span>Yoklama</span></button>
    <button data-page="courses" onclick="go('courses')"><i>🗓️</i><span>Dersler</span></button>
    <button class="navMoreBtn" data-page="more" onclick="openMore()"><i>☰</i><span>Daha Fazla</span></button>
  </nav>
  <div class="sidebarFoot"><div id="clock">—</div><div class="miniStats"><div class="mini"><strong id="sideStudents">—</strong>Aktif Öğrenci</div><div class="mini"><strong id="sideDebt">—</strong>Beklenen Ödeme</div></div></div>
</aside>
<main class="main">
<header class="top"><div class="topTitle"><h1 id="pageTitle">Genel Bakış</h1><p id="pageSub">Sheets verilerinizin canlı yönetim merkezi</p></div><div class="topActions"><button class="btn dark" onclick="openWebApp()">↗ Yeni Sekmede Aç</button><button class="btn" onclick="refresh()">↻ Yenile</button><button class="btn sheetBtn primary" onclick="openSheet('ÖĞRENCİLER')">Google Sheets</button><button class="btn appModeBtn" onclick="enterAppMode()">⛶ Tam Ekran</button><button class="btn" onclick="openGasSetup_()" title="Bağlantı Ayarları">⚙️</button></div></header>
<section id="content" class="content"><div class="loading"><div><div class="spinner"></div><p style="text-align:center;margin-top:12px">Sheets verileri yükleniyor…</p></div></div></section>
</main></div>
<div id="detail" class="detail"><aside class="drawer"><div id="detailContent"></div></aside></div>
<div id="formModal" class="modalForm"><div class="formBox" id="formBox"></div></div>
<div id="moreSheet" class="moreSheet">
  <div class="moreSheetBg" onclick="closeMore()"></div>
  <div class="moreSheetPanel">
    <div class="moreSheetHandle"></div>
    <h3>Daha Fazla</h3>
    <button onclick="goMore('annual')"><i>📅</i>Yıllık Ödemeler</button>
    <button onclick="goMore('finance')"><i>📈</i>Gelir / Gider</button>
    <button onclick="goMore('courses')"><i>🗓️</i>Dersler</button>
    <button onclick="closeMore();openSheet('ÖĞRENCİLER')"><i>📄</i>Google Sheets'i Aç</button>
    <button onclick="closeMore();openGasSetup_()"><i>⚙️</i>Bağlantı Ayarları</button>
    <button onclick="closeMore();setPin_()"><i>🔒</i>PIN Belirle / Değiştir</button>
    <button onclick="closeMore();gasLogout_()"><i>🚪</i>Bağlantıyı Unut (Çıkış)</button>
    <button class="moreSheetCancel" onclick="closeMore()">Vazgeç</button>
  </div>
</div>
<div id="toast" class="toast"></div>

<script src="bridge.js"></script>
<script src="app.js"></script>
</body>
</html>
